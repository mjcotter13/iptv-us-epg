name: Build Custom US EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [ "main" ]
    paths:
      - "build_epg.py"
      - "v7_prepare.py"
      - "v7_run.py"
      - "v7_merge.py"
      - "v8_discover.py"
      - ".github/workflows/build-epg.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clone official IPTV-org EPG repository
        run: git clone --depth 1 https://github.com/iptv-org/epg.git _iptv_epg
      - name: Install IPTV-org EPG dependencies
        working-directory: _iptv_epg
        run: npm ci
      - name: Prepare exact and conservative fuzzy candidates
        run: python v7_prepare.py
      - name: Run conditional targeted grabs
        run: python v7_run.py
      - name: Merge targeted results
        run: python v7_merge.py
      - name: Build merged production EPG
        run: python build_epg.py
      - name: Discover new V8 source candidates
        run: python v8_discover.py

      - name: Preserve V8 diagnostics
        run: |
          mkdir -p public/v7 public/v8
          cp v7_work/channels.csv public/v7/channels.csv
          cp v7_work/remaining_source_matrix.csv public/v7/remaining_source_matrix.csv
          cp v8_work/source_discovery.csv public/v8/source_discovery.csv
          cp v7_work/attempts.csv public/v7/attempts.csv
          cp v7_targeted_status.csv public/v7/targeted_status.csv
          cp v7_attempt_status.csv public/v7/attempt_status.csv
          cp v7_targeted_guide.xml public/v7/targeted_guide.xml
      - name: Commit refreshed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh custom US EPG"
            git pull --rebase origin main
            git push
          fi
