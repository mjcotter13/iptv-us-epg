name: Build Custom US EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [ "main" ]
    paths:
      - "build_epg.py"
      - "stable_merge.py"
      - "proven_mappings.csv"
      - "v7_prepare.py"
      - "v7_run.py"
      - "v7_merge.py"
      - "v9_priority_rescue.py"
      - "v9_merge_priority.py"
      - "v10_generic_rescue.py"
      - "v10_merge_rescue.py"
      - ".github/workflows/build-epg.yml"

permissions:
  contents: write

concurrency:
  group: production-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Save currently published guide
        run: |
          if [ -f public/guide.xml.gz ]; then
            cp public/guide.xml.gz /tmp/previous_guide.xml.gz
          else
            git show 4c6d667:public/guide.xml.gz > /tmp/previous_guide.xml.gz
          fi

      - name: Clone official IPTV-org EPG repository
        run: git clone --depth 1 https://github.com/iptv-org/epg.git _iptv_epg

      - name: Install IPTV-org EPG dependencies
        working-directory: _iptv_epg
        run: npm ci

      - name: Prepare accurate targeted candidates
        run: python v7_prepare.py

      - name: Run conditional targeted grabs
        run: python v7_run.py

      - name: Merge targeted results
        run: python v7_merge.py

      - name: Build fresh candidate EPG
        run: python build_epg.py

      - name: V9 rescue priority favorites
        run: python v9_priority_rescue.py

      - name: Merge V9 priority favorites
        run: python v9_merge_priority.py

      - name: V10 generic multi-platform rescue
        run: python v10_generic_rescue.py

      - name: Merge V10 rescue
        run: python v10_merge_rescue.py

      - name: Save candidate diagnostics
        run: |
          cp public/status.txt public/candidate_status.txt
          cp public/guide.xml.gz /tmp/candidate_guide.xml.gz
          cp v9_priority_status.txt public/v9_priority_status.txt || true
          cp v10_rescue_status.txt public/v10_rescue_status.txt || true
          cp v10_rescue_report.csv public/v10_rescue_report.csv || true

      - name: Apply non-regression stability merge
        run: |
          python stable_merge.py \
            --previous /tmp/previous_guide.xml.gz \
            --candidate /tmp/candidate_guide.xml.gz \
            --output public/guide.xml.gz \
            --status public/status.txt

      - name: Preserve targeted diagnostics
        run: |
          mkdir -p public/v7
          cp v7_work/channels.csv public/v7/channels.csv || true
          cp v7_work/attempts.csv public/v7/attempts.csv || true
          cp v7_targeted_status.csv public/v7/targeted_status.csv || true
          cp v7_attempt_status.csv public/v7/attempt_status.csv || true
          cp v7_targeted_guide.xml public/v7/targeted_guide.xml || true

      - name: Commit stable published guide safely
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/publish/public/v7

          cp public/guide.xml.gz /tmp/publish/public/guide.xml.gz
          cp public/status.txt /tmp/publish/public/status.txt
          cp public/candidate_status.txt /tmp/publish/public/candidate_status.txt

          if [ -f public/v9_priority_status.txt ]; then
            cp public/v9_priority_status.txt /tmp/publish/public/v9_priority_status.txt
          fi

          if [ -f public/v10_rescue_status.txt ]; then
            cp public/v10_rescue_status.txt /tmp/publish/public/v10_rescue_status.txt
          fi

          if [ -f public/v10_rescue_report.csv ]; then
            cp public/v10_rescue_report.csv /tmp/publish/public/v10_rescue_report.csv
          fi

          for f in channels.csv attempts.csv targeted_status.csv attempt_status.csv targeted_guide.xml; do
            if [ -f "public/v7/$f" ]; then
              cp "public/v7/$f" "/tmp/publish/public/v7/$f"
            fi
          done

          git fetch origin main
          git reset --hard origin/main

          mkdir -p public/v7

          cp /tmp/publish/public/guide.xml.gz public/guide.xml.gz
          cp /tmp/publish/public/status.txt public/status.txt
          cp /tmp/publish/public/candidate_status.txt public/candidate_status.txt

          if [ -f /tmp/publish/public/v9_priority_status.txt ]; then
            cp /tmp/publish/public/v9_priority_status.txt public/v9_priority_status.txt
          fi

          if [ -f /tmp/publish/public/v10_rescue_status.txt ]; then
            cp /tmp/publish/public/v10_rescue_status.txt public/v10_rescue_status.txt
          fi

          if [ -f /tmp/publish/public/v10_rescue_report.csv ]; then
            cp /tmp/publish/public/v10_rescue_report.csv public/v10_rescue_report.csv
          fi

          for f in channels.csv attempts.csv targeted_status.csv attempt_status.csv targeted_guide.xml; do
            if [ -f "/tmp/publish/public/v7/$f" ]; then
              cp "/tmp/publish/public/v7/$f" "public/v7/$f"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/guide.xml.gz \
            public/status.txt \
            public/candidate_status.txt \
            public/v7/ \
            public/v9_priority_status.txt \
            public/v10_rescue_status.txt \
            public/v10_rescue_report.csv

          if git diff --cached --quiet; then
            echo "No published changes."
          else
            git commit -m "Refresh stable custom US EPG"
            git push origin main
          fi
