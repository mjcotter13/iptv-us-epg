name: Build Custom US EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [ "main" ]
    paths:
      - "build_epg.py"
      - "v7_prepare.py"
      - "v7_merge.py"
      - ".github/workflows/build-epg.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone official IPTV-org EPG repository
        run: git clone --depth 1 https://github.com/iptv-org/epg.git _iptv_epg

      - name: Install IPTV-org EPG dependencies
        working-directory: _iptv_epg
        run: npm ci

      - name: Select 25 high-value targeted channels
        run: python v7_prepare.py

      - name: Grab targeted channels one at a time
        shell: bash
        run: |
          tail -n +2 v7_work/targets.csv | while IFS=, read -r id name group site site_id xmltv_id safe channel_file guide_file source_file; do
            # CSV values used here do not contain commas for the selected control fields.
            echo "===== $id | $site ====="
            (
              cd _iptv_epg
              NODE_OPTIONS=--max-old-space-size=2048 npm run grab --- \
                --channels="../v7_work/${channel_file}" \
                --output="../v7_work/${guide_file}" \
                --days=1 \
                --maxConnections=1 \
                --delay=1000 \
                --timeout=30000
            ) || echo "WARNING: grab failed for $id"
          done

      - name: Merge targeted results
        run: python v7_merge.py

      - name: Build merged production EPG
        run: python build_epg.py

      - name: Preserve V7 diagnostics
        run: |
          mkdir -p public/v7
          cp v7_work/targets.csv public/v7/targets.csv
          cp v7_targeted_status.csv public/v7/targeted_status.csv
          cp v7_targeted_guide.xml public/v7/targeted_guide.xml

      - name: Commit refreshed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh custom US EPG"
            git pull --rebase origin main
            git push
          fi
