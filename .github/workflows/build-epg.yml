name: Build Custom US EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [ "main" ]
    paths:
      - "build_epg.py"
      - "v7_prepare.py"
      - "v7_merge.py"
      - ".github/workflows/build-epg.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone official IPTV-org EPG repository
        run: git clone --depth 1 https://github.com/iptv-org/epg.git _iptv_epg

      - name: Install IPTV-org EPG dependencies
        working-directory: _iptv_epg
        run: npm ci

      - name: Prepare 25 high-value channels with fallback mappings
        run: python v7_prepare.py

      - name: Grab each mapping attempt in a fresh Node process
        shell: bash
        run: |
          python - <<'PY'
          import csv, subprocess, os
          from pathlib import Path

          attempts = list(csv.DictReader(open("v7_work/attempts.csv", encoding="utf-8")))

          for a in attempts:
              cid = a["id"]
              print(f"===== {cid} | attempt {a['attempt']} | {a['site']} =====", flush=True)

              env = os.environ.copy()
              env["NODE_OPTIONS"] = "--max-old-space-size=2048"

              cmd = [
                  "npm", "run", "grab", "---",
                  f"--channels=../v7_work/{a['channel_file']}",
                  f"--output=../v7_work/{a['guide_file']}",
                  "--days=1",
                  "--maxConnections=1",
                  "--delay=1000",
                  "--timeout=30000",
              ]

              try:
                  subprocess.run(
                      cmd,
                      cwd="_iptv_epg",
                      env=env,
                      check=False,
                      timeout=150,
                  )
              except subprocess.TimeoutExpired:
                  print(f"WARNING: timed out: {cid} attempt {a['attempt']}", flush=True)
          PY

      - name: Merge targeted results
        run: python v7_merge.py

      - name: Build merged production EPG
        run: python build_epg.py

      - name: Preserve V7.1 diagnostics
        run: |
          mkdir -p public/v7
          cp v7_work/channels.csv public/v7/channels.csv
          cp v7_work/attempts.csv public/v7/attempts.csv
          cp v7_targeted_status.csv public/v7/targeted_status.csv
          cp v7_attempt_status.csv public/v7/attempt_status.csv
          cp v7_targeted_guide.xml public/v7/targeted_guide.xml

      - name: Commit refreshed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh custom US EPG"
            git pull --rebase origin main
            git push
          fi
